name: courtside

services:
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      ENVIRONMENT: production
      DATA_DIR: /data
    volumes:
      - data:/data
    restart: unless-stopped

  proxy:
    image: caddy:2.11.7-alpine
    environment:
      API_DOMAIN: "${API_DOMAIN:?set API_DOMAIN in .env at the repository root}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
  caddy-data:
  caddy-config:
